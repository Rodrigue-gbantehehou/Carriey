[pytest]
pythonpath = .
testpaths = tests
addopts = -ra --strict-markers
markers =
    payment: paiements, webhooks, consommation d'un paiement
    rights: rôles (user/admin/super_admin) et isolation entre utilisateurs (IDOR)
    export: génération PDF/DOCX, liens de téléchargement, gating premium
    auth: login, JWT, révocation, reset/setup password
    ai_quota: quotas IA journaliers, journalisation des coûts
    security_gap: faille connue documentée par un xfail strict (doit être corrigée)
filterwarnings =
    ignore::DeprecationWarning
